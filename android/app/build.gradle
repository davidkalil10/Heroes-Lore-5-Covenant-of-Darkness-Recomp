def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "com.davidbraga.heroeslore5"
    }
    compileSdkVersion 34
    buildToolsVersion '34.0.0'

    // Resolução de NDK: prioriza variável de ambiente ANDROID_NDK_VERSION,
    // ou detecta dinamicamente a versão já instalada no runner/ambiente local
    def resolvedNdkVersion = System.getenv("ANDROID_NDK_VERSION")
    if (!resolvedNdkVersion) {
        def ndkBase = "${System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')}/ndk"
        def ndkDir = file(ndkBase)
        if (ndkDir.exists() && ndkDir.list()) {
            def versions = ndkDir.list().findAll { !it.startsWith('.') }.sort()
            if (!versions.isEmpty()) {
                resolvedNdkVersion = versions.last()
            }
        }
    }
    if (resolvedNdkVersion) {
        ndkVersion resolvedNdkVersion
    }

    defaultConfig {
        applicationId "com.davidbraga.heroeslore5"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=Release"
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }
    signingConfigs {
        release {
            storeFile file('heroes_lore_5.keystore')
            storePassword 'heroeslore'
            keyAlias 'heroeslore'
            keyPassword 'heroeslore'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "com.davidbraga.heroeslore5.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
